on:
  push:
    branches:
      - 'master'
jobs:
  s3_sync:
    environment:
      name: production
      url: https://blog.unasuke.com
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update && sudo apt-get install -y libvips-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::423695832787:role/static-site-deploy-role
          aws-region: ap-northeast-1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
      - run: npm ci
      - run: bundle exec middleman build
      # The OpenBSD host of blog.unasuke.com. blogsync can only run rrsync into the document root there.
      - name: Write the SSH key and known_hosts for the origin
        env:
          BLOG_ORIGIN_KNOWN_HOSTS: ${{ secrets.BLOG_ORIGIN_KNOWN_HOSTS }}
          BLOG_ORIGIN_SSH_KEY: ${{ secrets.BLOG_ORIGIN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BLOG_ORIGIN_KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/blog_origin
          printf '%s\n' "$BLOG_ORIGIN_SSH_KEY" > ~/.ssh/blog_origin
      - name: rsync to the origin
        env:
          BLOG_ORIGIN_HOST: ${{ secrets.BLOG_ORIGIN_HOST }}
        run: rsync -rlz --delete --chmod=D755,F644 -e "ssh -p 9922 -i $HOME/.ssh/blog_origin" ./build/ "blogsync@$BLOG_ORIGIN_HOST:"
      - run: aws s3 sync ./build s3://static-site-blog-unasuke-com --delete --quiet
      - run: aws cloudfront create-invalidation --distribution-id E27VRKNRHRNYHG --paths "/*"
